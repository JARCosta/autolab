x-autolab-base: &autolab-base
  build: .
  env_file:
    - .env
  environment:
    - AUTOLAB_UID=${UID:-1000}
    - AUTOLAB_GID=${GID:-1000}
    - PYTHONPATH=/app
  volumes:
    - ./data:/app/data
  restart: on-failure

services:
  # ── Webapp (always on) ───────────────────────────────────────
  # Hosts the home dashboard, the per-module toggle API, and the Telegram
  # webhook. Other services are pulled in via compose --profile <name>.
  autolab-web:
    <<: *autolab-base
    container_name: autolab-web
    command: ["python", "-m", "app.runtime.entrypoint", "web"]
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ── StreamElements / Twitch bettor threads ───────────────────
  autolab-bettors:
    <<: *autolab-base
    container_name: autolab-bettors
    command: ["python", "-m", "app.runtime.entrypoint", "bettors"]
    profiles: ["bettors"]

  # ── Discord boost_bot (CS2 custom queue) ─────────────────────
  autolab-discord:
    <<: *autolab-base
    container_name: autolab-discord
    command: ["python", "-m", "app.runtime.entrypoint", "discord"]
    profiles: ["discord"]

  # ── Wallapop search tracker ──────────────────────────────────
  autolab-wallapop:
    <<: *autolab-base
    container_name: autolab-wallapop
    command: ["python", "-m", "app.runtime.entrypoint", "wallapop"]
    profiles: ["wallapop"]

  # ── Tailscale (optional VPN / subnet router) ─────────────────
  # Settings from the web dashboard write data/tailscale.env (see /tailscale).
  autolab-tailscale:
    image: tailscale/tailscale:latest
    container_name: autolab-tailscale
    profiles: ["tailscale"]
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data/tailscale-state:/var/lib/tailscale
    env_file:
      - data/tailscale.env
    restart: unless-stopped
